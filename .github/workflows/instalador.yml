# Gera o instalador do Presage e publica a release que o app consulta.
#
# Existe por dois motivos. O `tauri build` precisa do MSVC, e instalar MSVC
# pede administrador — as máquinas windows-latest já vêm com ele. E a release
# daqui é o endereço que o atualizador do app procura, então é daqui que a
# atualização automática sai.
#
# Disparo manual na aba Actions, ou empurrando uma tag `v*`.

name: Instalador

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Sem cache, cada build recompila a árvore inteira do Tauri: ~15 minutos.
      - uses: Swatinem/rust-cache@v2

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: cargo test --workspace

      - name: Compilar o app e empacotar
        run: npm run tauri build
        env:
          # A chave que assina a ATUALIZAÇÃO, não o executável. Sem ela o build
          # sai sem o `.sig`, o manifesto não tem assinatura e todo app instalado
          # recusa o download — que é a proteção funcionando.
          #
          # Guarde o conteúdo de `~/.presage/updater.key` no secret
          # UPDATER_PRIVATE_KEY. Ela nunca vai para o repositório.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATER_KEY_PASSWORD }}
          CI: true

      # Assinatura de código é outra coisa, e usa outra configuração:
      # `bundle.windows.certificateThumbprint` no tauri.conf.json, com o
      # certificado instalado na máquina. Sem ela o SmartScreen avisa quem
      # baixa — e, como já vimos, um antivírus pode ir além de avisar.

      - name: Gerar o manifesto da atualização
        if: startsWith(github.ref, 'refs/tags/')
        run: >
          node scripts/manifesto.mjs
          --url https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
          --notas "Presage ${{ github.ref_name }}"

      - name: Guardar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: presage-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

      # O `latest.json` precisa entrar na release junto, e a release precisa
      # sair publicada: um rascunho não é servido pela URL `latest/download`,
      # então ninguém receberia a atualização.
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: Presage ${{ github.ref_name }}
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            latest.json
