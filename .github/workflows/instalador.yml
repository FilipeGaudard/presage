# Gera o instalador do Presage e publica a release que o app consulta.
#
# Existe por dois motivos. O `tauri build` precisa do MSVC, e instalar MSVC
# pede administrador — as máquinas windows-latest já vêm com ele. E a release
# daqui é o endereço que o atualizador do app procura, então é daqui que a
# atualização automática sai.
#
# Disparo manual na aba Actions, empurrando uma tag `v*` (publica a release) ou
# empurrando um branch `ci/...` (só guarda o instalador como artefato).

name: Instalador

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # Branch `ci/...` compila e guarda o instalador, sem publicar nada: serve
    # para testar antes da tag. E funciona num fork recém-criado, onde o disparo
    # manual só aparece depois que o workflow chega à main.
    branches: ["ci/**"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    env:
      # Secret não pode entrar num `if:`; uma variável de ambiente pode.
      TEM_CHAVE: ${{ secrets.UPDATER_PRIVATE_KEY != '' }}

    steps:
      # Release sem a chave sairia sem assinatura, e nenhum app instalado
      # aceitaria o download. Melhor falhar aqui, antes de 15 minutos de build.
      - name: Tag exige a chave
        if: startsWith(github.ref, 'refs/tags/') && env.TEM_CHAVE != 'true'
        run: |
          echo "::error::Tag sem o secret UPDATER_PRIVATE_KEY: a release sairia sem assinatura."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Sem cache, cada build recompila a árvore inteira do Tauri: ~15 minutos.
      - uses: Swatinem/rust-cache@v2

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: cargo test --workspace

      - name: Compilar o app e empacotar
        if: env.TEM_CHAVE == 'true'
        run: npm run tauri build
        env:
          # A chave que assina a ATUALIZAÇÃO, não o executável. O `.sig` que ela
          # gera vai para o manifesto, e todo app instalado confere com a chave
          # pública antes de executar.
          #
          # Guarde o conteúdo de `~/.presage/updater.key` no secret
          # UPDATER_PRIVATE_KEY. Ela nunca vai para o repositório.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATER_KEY_PASSWORD }}
          CI: true

      # Sem a chave (num fork, por exemplo) o Tauri não sai sem o `.sig`: ele
      # falha, porque a chave pública está no tauri.conf.json. `--no-sign` pula
      # a assinatura da atualização e o instalador sai para teste. Release não
      # passa por aqui — o primeiro passo derruba tag sem chave.
      # bash, não PowerShell: o `npm.ps1` engole o `--`, e o `--no-sign` não
      # chegaria ao Tauri.
      - name: Compilar o app sem assinar a atualização
        if: env.TEM_CHAVE != 'true'
        shell: bash
        run: npm run tauri -- build --no-sign
        env:
          CI: true

      # Assinatura de código é outra coisa, e usa outra configuração:
      # `bundle.windows.certificateThumbprint` no tauri.conf.json, com o
      # certificado instalado na máquina. Sem ela o SmartScreen avisa quem
      # baixa — e, como já vimos, um antivírus pode ir além de avisar.

      - name: Gerar o manifesto da atualização
        if: startsWith(github.ref, 'refs/tags/')
        run: >
          node scripts/manifesto.mjs
          --url https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
          --notas "Presage ${{ github.ref_name }}"

      - name: Guardar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: presage-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

      # O `latest.json` precisa entrar na release junto, e a release precisa
      # sair publicada: um rascunho não é servido pela URL `latest/download`,
      # então ninguém receberia a atualização.
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: Presage ${{ github.ref_name }}
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            latest.json
